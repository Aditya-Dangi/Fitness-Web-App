<mat-toolbar class="navbar">
  <a routerLink="/" class="logo-link" (click)="closeMenu()">
    <img src="assets/images/Logo.png" alt="Fitness App" class="logo" />
    <span class="brand-name">FitApp</span>
  </a>

  <span class="spacer"></span>

  <nav id="primary-nav" class="nav-links" [class.open]="menuOpen" aria-label="Primary">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
      (click)="closeMenu()"
    >Home</a>
    <a href="#exercises" class="nav-link" (click)="closeMenu()">Exercises</a>

    <div class="theme-toggle-wrap mobile-only" [matTooltip]="(themeService.isDark$ | async) ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <mat-icon class="theme-icon">{{ (themeService.isDark$ | async) ? 'dark_mode' : 'light_mode' }}</mat-icon>
      <mat-slide-toggle
        [checked]="(themeService.isDark$ | async) ?? false"
        (change)="toggleTheme()"
        color="warn"
        aria-label="Toggle dark mode"
      ></mat-slide-toggle>
    </div>
  </nav>

  <div class="theme-toggle-wrap desktop-only" [matTooltip]="(themeService.isDark$ | async) ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
    <mat-icon class="theme-icon">{{ (themeService.isDark$ | async) ? 'dark_mode' : 'light_mode' }}</mat-icon>
    <mat-slide-toggle
      [checked]="(themeService.isDark$ | async) ?? false"
      (change)="toggleTheme()"
      color="warn"
      aria-label="Toggle dark mode"
    ></mat-slide-toggle>
  </div>

  <button
    mat-icon-button
    type="button"
    class="menu-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-controls="primary-nav"
    aria-label="Toggle navigation menu"
  >
    <mat-icon>{{ menuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>
</mat-toolbar>
