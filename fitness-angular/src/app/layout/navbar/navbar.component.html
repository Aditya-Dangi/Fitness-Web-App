<mat-toolbar class="navbar">
  <a routerLink="/" class="logo-link">
    <img src="assets/images/Logo.png" alt="Fitness App" class="logo" />
    <span class="brand-name">FitApp</span>
  </a>

  <span class="spacer"></span>

  <nav class="nav-links">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >Home</a>
    <a href="#exercises" class="nav-link">Exercises</a>
  </nav>

  <div class="theme-toggle-wrap" [matTooltip]="(themeService.isDark$ | async) ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
    <mat-icon class="theme-icon">{{ (themeService.isDark$ | async) ? 'dark_mode' : 'light_mode' }}</mat-icon>
    <mat-slide-toggle
      [checked]="(themeService.isDark$ | async) ?? false"
      (change)="toggleTheme()"
      color="warn"
      aria-label="Toggle dark mode"
    ></mat-slide-toggle>
  </div>
</mat-toolbar>
